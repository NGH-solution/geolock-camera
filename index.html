<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoLock Camera — Legal &amp; Policy</title>
<meta name="description" content="Privacy Policy and Terms of Use for GeoLock Camera by NGH.">
<style>
  :root{
    --bg:#0f1115; --panel:#161922; --text:#e8eaf0; --muted:#9aa3b2;
    --accent:#5eb0ff; --border:#262b38;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fb; --panel:#ffffff; --text:#1a1d27; --muted:#5a6272; --accent:#2f6fd6; --border:#e4e7ef; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:4rem 1.25rem}
  .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.3rem}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .brand span{font-weight:700;letter-spacing:.02em;color:var(--muted);font-size:.85rem;text-transform:uppercase}
  h1{font-size:1.6rem;margin:.2rem 0 1.6rem;letter-spacing:-.01em}
  a.card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:1.1rem 1.3rem;margin-bottom:.9rem;text-decoration:none;color:var(--text)}
  a.card:hover{border-color:var(--accent)}
  a.card .t{font-weight:600;font-size:1.02rem}
  a.card .d{color:var(--muted);font-size:.88rem;margin-top:.25rem}
  footer{margin-top:2.5rem;color:var(--muted);font-size:.85rem}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><span>NGH</span></div>
  <h1>GeoLock Camera — Legal &amp; Policy</h1>
  <a class="card" href="./privacy/">
    <div class="t">Privacy Policy</div>
    <div class="d">What the app accesses, why, and your choices.</div>
  </a>
  <a class="card" href="./terms/">
    <div class="t">Terms of Use</div>
    <div class="d">Rules for using GeoLock Camera.</div>
  </a>
  <footer>Published by NGH · <a href="mailto:thanhnghiaandroid@gmail.com">thanhnghiaandroid@gmail.com</a> ·
  <a href="https://alex-nguyen.store/" rel="noopener">alex-nguyen.store</a></footer>
</div>
</body>
</html>
